[package]
name = "wal-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `wr/wal.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
# 绑定层按原版签名逐参数生成，参数个数由 Python 源码决定。
too_many_arguments = "allow"

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
