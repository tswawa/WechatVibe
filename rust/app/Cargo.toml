[package]
name = "wechatvibe"
version = "1.3.6"
edition = "2024"
rust-version = "1.97"
publish = false
description = "WechatVibe Rust entry point: process orchestration + read-only local analysis"

[[bin]]
name = "wechatvibe"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
strip = true

[lints.clippy]
all = { level = "warn", priority = -1 }
