[package]
name = "wr-discovery"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of wr/discovery.py's path and config discovery (no live process scan)"

[lib]
name = "wr_discovery"
path = "src/lib.rs"

[[bin]]
name = "wr-discovery"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
encoding_rs = "0.8"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
