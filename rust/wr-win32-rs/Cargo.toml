[package]
name = "wr-win32"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of wr/window.py, window_uia.py and the Win32 half of wr/discovery.py"

[lib]
name = "wr_win32"
path = "src/lib.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = { version = "1", default-features = false, features = ["zlib"] }
crc32fast = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_UI_Accessibility",
  "Win32_System_Com",
] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
