[package]
name = "png-encode-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `wr/png_encode.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
flate2 = { version = "1", default-features = false, features = ["zlib"] }
crc32fast = "1"


[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
